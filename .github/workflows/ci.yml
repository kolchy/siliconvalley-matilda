name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # No package.json yet -> pass, so the required check never blocks an empty repo.
      - name: Install and test
        run: |
          if [ ! -f package.json ]; then echo "No package.json; skipping."; exit 0; fi
          npm ci
          npm test
